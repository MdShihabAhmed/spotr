<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Spotr">
  <!-- Dark tile so the mark stays visible on any browser tab, light or dark. -->
  <rect width="32" height="32" fill="#201d27"/>
  <!-- Rails -->
  <rect x="7" y="4" width="2.4" height="24" fill="#4d4857"/>
  <rect x="22.6" y="4" width="2.4" height="24" fill="#4d4857"/>
  <!-- Sealed rungs (top): withheld, muted -->
  <rect x="7" y="5.6" width="18" height="2.8" fill="#5b5667"/>
  <rect x="7" y="12.1" width="18" height="2.8" fill="#5b5667"/>
  <!-- Earned rungs (bottom): lit green -->
  <rect x="7" y="18.6" width="18" height="2.8" fill="#34c46a"/>
  <rect x="7" y="25.1" width="18" height="2.8" fill="#57e089"/>
</svg>
