# Pinned so volume names (spotr_pgdata, …) don't silently change if the repo
# directory is renamed - Compose otherwise derives the project name from it.
name: spotr

# Full self-host stack: `docker compose up -d` builds and runs everything
# (postgres + redis + qdrant + migrate + api + worker + frontend). BYOK: put your key in
# backend/.env (OPENAI_API_KEY).
#
# Roles share one backend image; the compose `command` picks the role. DATABASE_URL/REDIS_URL/
# QDRANT_URL are overridden here to the in-network service hostnames (backend/.env keeps the
# localhost values for `uv run` dev).

x-backend-env: &backend-env
  DATABASE_URL: postgresql://spotr_user:password@postgres:5432/spotr
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotr_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spotr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotr_user -d spotr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # One-shot: apply Alembic migrations, then exit. api/worker wait for it to finish, so the
  # schema is ready before either serves - and only one process ever runs migrations.
  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment:
      <<: *backend-env
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      <<: *backend-env
      # A dedicated worker container processes the queue, so the API doesn't run it inline.
      RUN_INLINE_WORKER: "false"
      # The browser loads the SPA from :8080 and calls the API cross-origin.
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
    ports:
      # Host port is overridable (`API_PORT=8000 docker compose up`) - 8001 by default since
      # 8000 is a common dev-server port other projects on the same machine may already hold.
      - "${API_PORT:-8001}:8000"
    volumes:
      # Uploaded source files live here and must be shared with the worker that ingests them.
      - corpora:/app/corpora
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The durable ingestion queue's worker. Scale with `--scale worker=N`: FOR UPDATE SKIP
  # LOCKED means no two workers ever claim the same job.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      <<: *backend-env
    command: ["uv", "run", "python", "-m", "app.worker"]
    volumes:
      # Same source-file volume as the API, so the worker can read what was uploaded.
      - corpora:/app/corpora
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; must be reachable from the browser. Keep in
        # sync with the api service's host port (API_PORT above) if you override it.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  qdrant_data:
  corpora:
