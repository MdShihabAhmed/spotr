# Pinned so volume names (forcesai_pgdata, …) don't silently change if the repo
# directory is renamed — Compose otherwise derives the project name from it.
name: forcesai

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: forcesai_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forcesai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forcesai_user -d forcesai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

# Judge0 is NOT included here: it requires privileged containers and ships its own
# docker-compose (https://github.com/judge0/judge0). Run it separately, or use a
# hosted instance and set JUDGE0_URL/JUDGE0_API_KEY accordingly.

volumes:
  pgdata:
  qdrant_data:
